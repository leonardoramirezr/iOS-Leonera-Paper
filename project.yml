# Proyecto generado con XcodeGen: `xcodegen generate` crea LeoneraPaper.xcodeproj.
# Los identificadores son build settings; el workflow los pasa a xcodebuild.
name: LeoneraPaper
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    APP_BUNDLE_ID: com.leonardoramirezr.leonerapaper
    SHARE_EXTENSION_BUNDLE_ID: $(APP_BUNDLE_ID).share
    APP_URL_SCHEME: leonerapaper
    GOOGLE_CLIENT_ID: ""
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LeoneraPaper:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LeoneraPaper
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LeoneraPaper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LeoneraShare
  LeoneraShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LeoneraShare
        PRODUCT_BUNDLE_IDENTIFIER: $(SHARE_EXTENSION_BUNDLE_ID)
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LeoneraShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  LeoneraPaper:
    build:
      targets:
        LeoneraPaper: all
        LeoneraShare: all
    run:
      config: Debug
    archive:
      config: Release
